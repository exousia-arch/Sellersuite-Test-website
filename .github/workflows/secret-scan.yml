# Scans every push and pull request (full history) for committed secrets. Fails the run on a finding.
name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          V=8.30.1
          B=https://github.com/gitleaks/gitleaks/releases/download/v$V
          F=gitleaks_${V}_linux_x64.tar.gz   # keep the real name: the checksum file lists it by name
          curl -sSfLO "$B/$F"
          curl -sSfL "$B/gitleaks_${V}_checksums.txt" -o sums.txt
          sha256sum -c --ignore-missing sums.txt
          tar -xzf "$F" gitleaks
      - run: ./gitleaks git --redact --no-banner -v
